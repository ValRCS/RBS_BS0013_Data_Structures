<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Data structure choice is a trade-off</title>
  <desc id="desc">Workload determines representation choice. The representation provides efficient target operations, imposes costs in other operations, memory, locality and complexity, and must preserve invariants. Engineering judgment is required because there is no universally best data structure.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
    <style>
      .box { fill: none; stroke: #111; stroke-width: 2; rx: 16; ry: 16; }
      .edge { fill: none; stroke: #555; stroke-width: 2; marker-end: url(#arrow); }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #111; text-anchor: middle; font-size: 22px; }
      .strong { font-weight: 700; font-size: 24px; }
      .small { font-size: 17px; }
    </style>
  </defs>

  <rect class="box" x="360" y="20" width="480" height="105"/>
  <text class="label" x="600" y="53">Workload</text>
  <text class="label strong" x="600" y="82">Which operations matter most?</text>
  <text class="label small" x="600" y="108">access · insert · find · minimum · traversal</text>

  <rect class="box" x="360" y="165" width="480" height="85"/>
  <text class="label" x="600" y="198">Representation choice</text>
  <text class="label strong" x="600" y="228">How should the data be organized?</text>

  <rect class="box" x="20" y="320" width="340" height="90"/>
  <text class="label" x="190" y="354">What we buy</text>
  <text class="label strong" x="190" y="386">Efficient target operations</text>

  <rect class="box" x="430" y="320" width="340" height="90"/>
  <text class="label" x="600" y="354">What we pay</text>
  <text class="label small" x="600" y="382">other operations · memory</text>
  <text class="label small" x="600" y="402">locality · complexity</text>

  <rect class="box" x="840" y="320" width="340" height="90"/>
  <text class="label" x="1010" y="354">What must remain true</text>
  <text class="label strong" x="1010" y="386">Representation invariants</text>

  <rect class="box" x="360" y="470" width="480" height="75"/>
  <text class="label" x="600" y="500">Engineering judgment</text>
  <text class="label strong" x="600" y="530">No universally best data structure</text>

  <path class="edge" d="M600 125 L600 165"/>
  <path class="edge" d="M515 250 L190 320"/>
  <path class="edge" d="M600 250 L600 320"/>
  <path class="edge" d="M685 250 L1010 320"/>
  <path class="edge" d="M190 410 L515 470"/>
  <path class="edge" d="M600 410 L600 470"/>
  <path class="edge" d="M1010 410 L685 470"/>
</svg>
